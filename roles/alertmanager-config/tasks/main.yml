---
- name: Validate Alertmanager configuration destination
  ansible.builtin.assert:
    that:
      - alertmanager_config_dir is defined
      - alertmanager_slack_webhook_url is defined
    fail_msg: "Define the Alertmanager configuration directory and webhook variable."

- name: Create Alertmanager configuration directory
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: root
    mode: "0640"
  no_log: true
