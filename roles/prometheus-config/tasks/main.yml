---
- name: Validate Prometheus configuration variables
  ansible.builtin.assert:
    that:
      - prometheus_config_dir is defined
      - prometheus_scrape_targets is defined
    fail_msg: "Define prometheus_config_dir and prometheus_scrape_targets."

- name: Create Prometheus configuration directory
  ansible.builtin.file:
    path: "{{ prometheus_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Prometheus scrape configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Prometheus

- name: Deploy Prometheus alert rules
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: "{{ prometheus_config_dir }}/alert-rules.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Prometheus
