---
- name: Verify supported Linux operating system
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_os_family in ["Debian", "RedHat"]
    fail_msg: "Only Debian-family and RedHat-family Linux systems are supported."

- name: Install containerd package
  ansible.builtin.package:
    name: containerd
    state: present

- name: Ensure kernel modules are configured for Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load overlay kernel module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure Kubernetes networking sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
  notify: Apply Kubernetes sysctl settings

- name: Check whether containerd configuration exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.shell:
    cmd: containerd config default > /etc/containerd/config.toml
    creates: /etc/containerd/config.toml
  when: not containerd_config.stat.exists
  notify: Restart containerd

- name: Enable systemd cgroups for containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup\s*=\s*false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Display worker node information
  ansible.builtin.debug:
    msg: "Configured {{ ansible_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
